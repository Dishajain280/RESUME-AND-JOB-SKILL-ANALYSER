# Frontend nginx: serves the SPA and reverse-proxies /api + /metrics to the
# backend container. This is the "trusted proxy" that sets X-Forwarded-For
# (enable TRUST_PROXY_HEADERS=true on the backend when using this setup).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Long cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint for container orchestration (no proxying)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ── API proxy ───────────────────────────────────────────────────────────
    # Uploads need the larger body limit; other routes are small.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;   # backend limit is 10 MB — leave headroom
        proxy_read_timeout 120s;    # analysis can take a few seconds
    }

    # Prometheus metrics (keep internal; scrape from the compose network)
    location /metrics {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        allow 172.16.0.0/12;    # docker networks
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
