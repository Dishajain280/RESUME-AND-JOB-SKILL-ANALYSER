name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: resume-analyser/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: resume-analyser/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DEBUG: "true"
          SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
          WARM_UP_MODELS_ON_STARTUP: "false"
        run: python -m pytest tests/ -v --tb=short

      - name: Verify Alembic migration applies cleanly
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-0123456789
          DATABASE_URL: sqlite:///./ci_mig_test.db
        run: |
          alembic upgrade head
          alembic downgrade base
          rm -f ci_mig_test.db

  frontend-tests:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-analyser/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: resume-analyser/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  docker-build:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t resume-analyser-api:ci ./resume-analyser/backend

      - name: Build frontend image
        run: docker build -t resume-analyser-web:ci ./resume-analyser/frontend
